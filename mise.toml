[tools]
erlang = "29.1.1"
elixir = "1.20.4-otp-29"
rebar = "3.27.1"
"github:WhatsApp/erlang-language-platform" = { version = "2026-10-14", matching = "otp-29.1", exe = "elp" }
actionlint = "1.7.12"
gh = "2.102.0"
git-cliff = "2.14.2"
markdownlint-cli2 = "0.23.3"
pandoc = "3.12.1"
shellcheck = "0.11.0"
yamllint = "1.38.0"

[settings]
# Hides the command line and timing that mise prints for each task.
task.quiet = true

[tasks.format]
description = "Format all code"
run = """
mix format
rebar3 fmt
mise fmt
"""

# The verify:mix:* tasks are chained with wait_for (not depends) so they run
# sequentially when scheduled together (concurrent mix runs contend for the
# build directory), while each task can still be run individually.
[tasks."verify:mix:compile"]
description = "Compile with warnings as errors"
# mix compile --warnings-as-errors does not fail on Erlang warnings.
env = { ERL_COMPILER_OPTIONS = "warnings_as_errors" }
run = "mix compile --force --warnings-as-errors"

[tasks."verify:mix:format"]
description = "Check code formatting"
wait_for = ["verify:mix:compile"]
run = "mix format --check-formatted"

[tasks."verify:mix:deps"]
description = "Check for unused dependencies in the lock file"
wait_for = ["verify:mix:format"]
run = "mix deps.unlock --check-unused"

[tasks."verify:mix:credo"]
description = "Run Credo checks"
wait_for = ["verify:mix:deps"]
run = "mix credo --strict"

[tasks."verify:mix:xref"]
description = "Check for compile-time dependency cycles"
wait_for = ["verify:mix:credo"]
run = "mix xref graph --format cycles --fail-above 0"

[tasks."verify:mix:docs"]
description = "Build documentation with warnings as errors"
wait_for = ["verify:mix:xref"]
run = "mix docs --warnings-as-errors"

[tasks."verify:mix"]
description = "Run mix verification checks"
depends = [
  "verify:mix:compile",
  "verify:mix:format",
  "verify:mix:deps",
  "verify:mix:credo",
  "verify:mix:xref",
  "verify:mix:docs",
]

# The verify:rebar:* tasks are chained like verify:mix:*, as rebar3 cannot run
# concurrently either.
[tasks."verify:rebar:format"]
description = "Check Erlang code formatting"
env = { QUIET = "1" }
run = "rebar3 fmt --check"

[tasks."verify:rebar:lint"]
description = "Run elvis lint checks"
env = { QUIET = "1" }
wait_for = ["verify:rebar:format"]
run = "rebar3 lint"

[tasks."verify:rebar"]
description = "Run rebar3 verification checks"
depends = ["verify:rebar:format", "verify:rebar:lint"]

[tasks."verify:elp"]
description = "Run ELP lint and eqWAlizer checks"
# elp eqwalize-all --rebar runs rebar3.
wait_for = ["verify:rebar:lint"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
# elp lint exits 0 even when it reports diagnostics.
diagnostics=$(elp lint --no-connect --path src --severity warning --color never)
if [[ -n "$diagnostics" ]]; then
  echo "$diagnostics"
  exit 1
fi
elp eqwalize-all --no-connect --rebar --bail-on-error
'''

[tasks."verify:markdown"]
description = "Lint Markdown files"
run = 'markdownlint-cli2 "**/*.md" "!_build" "!deps" "!doc" "!cover" "!tmp"'

[tasks."verify:yaml"]
description = "Lint YAML files"
run = "yamllint --strict -c .yamllint.yml ."

[tasks."verify:actions"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks.verify]
description = "Run all verification checks"
depends = [
  "verify:mix",
  "verify:rebar",
  "verify:elp",
  "verify:markdown",
  "verify:yaml",
  "verify:actions",
]

[tasks."release:version"]
description = "Print the version in src/tap.app.src"
run = '''
erl -noshell -eval '
  {ok, [{application, tap, App}]} = file:consult("src/tap.app.src"),
  io:format("~s~n", [proplists:get_value(vsn, App)]),
  halt().'
'''

[tasks."release:notes"]
description = "Print the CHANGELOG.md section for the version in src/tap.app.src"
run = '''
#!/usr/bin/env bash
set -euo pipefail
version=$(mise run --quiet release:version)
# Prints the lines between the version's heading and the next heading, without
# leading and trailing blank lines.
awk -v heading="## [$version]" '
  index($0, heading) == 1 { found = 1; next }
  found && /^## / { exit }
  found && !NF { blanks++; next }
  found {
    while (printed && blanks-- > 0) print ""
    blanks = 0
    printed = 1
    print
  }
  END {
    if (!found) {
      print "CHANGELOG.md has no " heading " section" > "/dev/stderr"
      exit 1
    }
  }
' CHANGELOG.md
'''

[tasks."release:prepare"]
description = "Set the release version in src/tap.app.src and regenerate CHANGELOG.md"
usage = '''
arg "[version]" help="Version, e.g. 0.2.0 (default: computed from commits)"
flag "--dry-run" help="Print the changelog section instead of writing files"
flag "--check" help="Fail if the version is not prepared instead of writing files"
'''
# Hides the INFO logs of git-cliff.
env = { RUST_LOG = "warn" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Changelogs are generated from v0.1.5 onwards; earlier releases are kept
# verbatim in the cliff.toml footer.
range=v0.1.5..HEAD
# git-cliff warns when no commit bumps the version; the tag check reports it.
version="${usage_version:-$(RUST_LOG=error git-cliff "$range" --bumped-version)}"
version="${version#v}"
if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
  echo "Invalid version: $version" >&2
  exit 1
fi
if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
  if [[ -n "${usage_version:-}" ]]; then
    echo "v$version is already tagged" >&2
    exit 1
  fi
  # Without a commit that bumps it, the computed version is the latest one.
  echo "Nothing to release since v$version" >&2
  if [[ "${usage_dry_run:-}" == true ]]; then
    exit
  fi
  exit 1
fi
if [[ "${usage_dry_run:-}" == true ]]; then
  git-cliff "$range" --unreleased --tag "v$version" --strip all
  exit
fi
if [[ "${usage_check:-}" == true ]]; then
  if [[ "$(mise run --quiet release:version)" != "$version" ]] ||
    ! git-cliff "$range" --tag "v$version" | cmp -s - CHANGELOG.md; then
    echo "Release $version is not prepared; run 'mise run release:prepare $version'" >&2
    exit 1
  fi
  exit
fi
# Rewrites file with the sed script. POSIX sed has no in-place flag.
replace() {
  sed "$2" "$1" > "$1.tmp"
  mv "$1.tmp" "$1"
}
replace src/tap.app.src 's/^    {vsn, "[^"]*"},$/    {vsn, "'"$version"'"},/'
if [[ "$(mise run --quiet release:version)" != "$version" ]]; then
  echo "Could not set the vsn in src/tap.app.src to $version" >&2
  exit 1
fi
git-cliff "$range" --tag "v$version" --output CHANGELOG.md
echo "Prepared release $version"
'''

[tasks."release:preview"]
description = "Print the changelog section of the next release"
usage = 'arg "[version]" help="Version, e.g. 0.2.0 (default: computed from commits)"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
# pandoc renders the Markdown on a terminal only, so piped output stays Markdown.
# Prints nothing when there is nothing to release.
render() {
  changelog=$(cat)
  if [[ -z "$changelog" ]]; then
    return
  fi
  if [[ -t 1 ]]; then
    # Recolors pandoc's fixed styles: inline code from red on white to yellow
    # without padding, lines that are all bold (## headings) to bold blue, and
    # lines that are all italic (### headings) to bold magenta.
    e=$'\e'
    # Separates the changelog from the command line and the shell prompt.
    echo
    rest="(${e}\[49m${e}\[24m${e}\[29m[^${e}]*${e}\[0m)$"
    printf '%s\n' "$changelog" | pandoc --from gfm --to ansi | sed -E \
      -e "s/${e}\[31m${e}\[47m(${e}\[24m${e}\[29m) ([^${e}]*) ${e}\[0m/${e}[33m${e}[49m\1\2${e}[0m/g" \
      -e "s/^${e}\[1m${e}\[23m${e}\[39m${rest}/${e}[1m${e}[23m${e}[34m\1/" \
      -e "s/^${e}\[22m${e}\[3m${e}\[39m${rest}/${e}[1m${e}[23m${e}[35m\1/"
    echo
  else
    printf '%s\n' "$changelog"
  fi
}
# git-cliff computes the next version from the latest tag, and CI creates the
# tags of published releases.
git fetch --quiet --tags origin
mise run --quiet release:prepare --dry-run ${usage_version:+"$usage_version"} | render
'''

[tasks."release:ready"]
description = "Check that there is something to release, HEAD is origin/main, the working copy is clean, and gh is logged in"
usage = 'arg "[version]" help="Version, e.g. 0.2.0 (default: computed from commits)"'
wait_for = ["release:preview"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
# release watches the CI run of the release commit with gh after pushing it.
if ! gh auth status > /dev/null; then
  echo "gh is not logged in; run 'gh auth login'" >&2
  exit 1
fi
git fetch --quiet --tags origin
# release:preview already printed why when there is nothing to release.
if [[ -z "$(mise run release:prepare --dry-run ${usage_version:+"$usage_version"} 2> /dev/null)" ]]; then
  exit 1
fi
if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
  echo "HEAD is not origin/main" >&2
  exit 1
fi
if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
  echo "The working copy has uncommitted changes" >&2
  exit 1
fi
'''

[tasks.release]
description = "Preview a release, then commit it, push it to main, and watch CI publish it"
usage = 'arg "[version]" help="Version, e.g. 0.2.0 (default: computed from commits)"'
# release:ready waits for release:preview, so the changelog section is printed
# even when the repository is not ready for a release.
depends = [
  "release:preview {{usage.version}}",
  "release:ready {{usage.version}}",
]
confirm = "Commit and push the release shown above to main?"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# In a colocated jj repository, the working-copy change is left behind once jj
# imports the new Git HEAD if a snapshot recorded the release edits in it.
# Without such a snapshot, the change is empty and jj abandons it itself.
jj_change=""
if command -v jj > /dev/null && jj root > /dev/null 2>&1; then
  jj_change=$(jj log --quiet --no-graph -r @ -T change_id)
fi
# release:ready ensures that all changes to tracked files come from
# release:prepare.
committed=false
trap '[[ $committed == true ]] || git checkout HEAD -- .' EXIT
mise run release:prepare ${usage_version:+"$usage_version"}
version=$(mise run --quiet release:version)
git commit --quiet -a -m "chore(release): $version"
committed=true
git push --quiet origin HEAD:main
if [[ -n "$jj_change" ]]; then
  jj abandon --quiet "present($jj_change)"
fi
echo "Pushed release $version; watching CI publish it"
# CI creates the run a few seconds after the push.
sha=$(git rev-parse HEAD)
run_id=""
for _ in {1..30}; do
  run_id=$(gh run list --commit "$sha" --workflow ci.yml --event push \
    --json databaseId --jq '.[0].databaseId')
  if [[ -n "$run_id" ]]; then
    break
  fi
  sleep 2
done
if [[ -z "$run_id" ]]; then
  echo "No CI run found for $sha" >&2
  exit 1
fi
# The release commit is on main at this point, so failures are reported with
# a way to recover instead of being undone.
if ! gh run watch "$run_id" --exit-status --compact --interval 10; then
  echo "CI failed for release $version; rerun the failed jobs with:" >&2
  echo "  gh run rerun --failed $run_id" >&2
  exit 1
fi
# The run also succeeds when release-check decides not to publish.
release=$(gh run view "$run_id" --json jobs \
  --jq '.jobs[] | select(.name == "Release") | .conclusion')
if [[ "$release" != success ]]; then
  echo "CI did not publish release $version (Release job: ${release:-missing})" >&2
  exit 1
fi
echo "Released $version"
echo "  https://github.com/eproxus/tap/releases/tag/v$version"
echo "  https://hex.pm/packages/tap/$version"
'''

[tasks.test]
description = "Run all tests"
run = "mix test"

[tasks.docs]
description = "Generate documentation"
run = "mix docs"

[tasks.iex]
description = "Start an interactive shell with the project loaded"
raw = true
run = "iex -S mix"
