[tools]
erlang = "29.1.1"
elixir = "1.20.4-otp-29"
actionlint = "1.7.12"
git-cliff = "2.14.2"
markdownlint-cli2 = "0.23.3"
shellcheck = "0.11.0"
yamllint = "1.38.0"

[tasks.format]
description = "Format all code"
run = """
mix format
mise fmt
"""

# The verify:mix:* tasks are chained with wait_for (not depends) so they run
# sequentially when scheduled together (concurrent mix runs contend for the
# build directory), while each task can still be run individually.
[tasks."verify:mix:compile"]
description = "Compile with warnings as errors"
run = "mix compile --force --warnings-as-errors"

[tasks."verify:mix:format"]
description = "Check code formatting"
wait_for = ["verify:mix:compile"]
run = "mix format --check-formatted"

[tasks."verify:mix:deps"]
description = "Check for unused dependencies in the lock file"
wait_for = ["verify:mix:format"]
run = "mix deps.unlock --check-unused"

[tasks."verify:mix:credo"]
description = "Run Credo checks"
wait_for = ["verify:mix:deps"]
run = "mix credo --strict"

[tasks."verify:mix:xref"]
description = "Check for compile-time dependency cycles"
wait_for = ["verify:mix:credo"]
run = "mix xref graph --format cycles --fail-above 0"

[tasks."verify:mix:docs"]
description = "Build documentation with warnings as errors"
wait_for = ["verify:mix:xref"]
run = "mix docs --warnings-as-errors"

[tasks."verify:mix"]
description = "Run mix verification checks"
depends = [
  "verify:mix:compile",
  "verify:mix:format",
  "verify:mix:deps",
  "verify:mix:credo",
  "verify:mix:xref",
  "verify:mix:docs",
]

[tasks."verify:markdown"]
description = "Lint Markdown files"
run = 'markdownlint-cli2 "**/*.md" "!_build" "!deps" "!doc" "!cover" "!tmp"'

[tasks."verify:yaml"]
description = "Lint YAML files"
run = "yamllint --strict -c .yamllint.yml ."

[tasks."verify:actions"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks.verify]
description = "Run all verification checks"
depends = ["verify:mix", "verify:markdown", "verify:yaml", "verify:actions"]

[tasks."release:prepare"]
description = "Set the release version in mix.exs and regenerate CHANGELOG.md"
usage = 'arg "[version]" help="Version, e.g. 0.2.0 (default: computed from commits)"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Changelogs are generated from v0.1.5 onwards; earlier releases are kept
# verbatim in the cliff.toml footer.
range=v0.1.5..HEAD
version="${usage_version:-$(git-cliff "$range" --bumped-version)}"
version="${version#v}"
if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
  echo "Invalid version: $version" >&2
  exit 1
fi
perl -pi -e 's/^  \@version "[^"]*"$/  \@version "'"$version"'"/' mix.exs
grep -q "^  @version \"$version\"$" mix.exs
git-cliff "$range" --tag "v$version" --output CHANGELOG.md
echo "Prepared release $version"
'''

[tasks."release:push"]
description = "Commit the prepared release and push it to main"
confirm = "Commit and push the prepared release to main?"
run = '''
#!/usr/bin/env bash
set -euo pipefail
git fetch origin
if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
  echo "HEAD is not origin/main" >&2
  exit 1
fi
changed=$(git status --porcelain --untracked-files=no | awk '{print $2}' | sort | tr '\n' ' ')
if [[ "$changed" != "CHANGELOG.md mix.exs " ]]; then
  echo "Expected changes to CHANGELOG.md and mix.exs only, got: $changed" >&2
  exit 1
fi
version=$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)
if ! grep -q "^## \[$version\]" CHANGELOG.md; then
  echo "CHANGELOG.md has no $version section; run 'mise run release:prepare'" >&2
  exit 1
fi
if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
  echo "v$version is already tagged" >&2
  exit 1
fi
# In a colocated jj repository, the working-copy change holding the release
# edits is left behind once jj imports the new Git HEAD.
jj_change=""
if command -v jj > /dev/null && jj root > /dev/null 2>&1; then
  jj_change=$(jj log --no-graph -r @ -T change_id)
fi
git commit -m "chore(release): $version" -- mix.exs CHANGELOG.md
git push origin HEAD:main
if [[ -n "$jj_change" ]]; then
  jj abandon "$jj_change"
fi
echo "Pushed release $version; CI publishes it once checks pass"
'''

[tasks.test]
description = "Run all tests"
run = "mix test"

[tasks.docs]
description = "Generate documentation"
run = "mix docs"

[tasks.iex]
description = "Start an interactive shell with the project loaded"
raw = true
run = "iex -S mix"
