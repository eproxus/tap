# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

# Stick to zero based versions before 1.0 release
[bump]
features_always_bump_minor = false
breaking_always_bump_major = false
initial_tag = "0.1.0"

[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/docs/#introduction
header = """
<!-- markdownlint-disable MD013 MD024 -->
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% if message %}
    {{ message }}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
            {% if commit.remote.username and commit.remote.username != remote.github.owner %} by @{{ commit.remote.username }}{%- endif -%}
            {% if commit.remote.pr_number %} in \
            [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}) \
            {%- endif -%}
            {%- if commit.group == "Added" and commit.body %}

{{ commit.body | trim | indent(prefix="  ", first=true, blank=false) }}
            {%- endif -%}
            {%- if commit.breaking %}
                {% raw %}    {% endraw %}- **BREAKING**: {{commit.breaking_description}}
            {%- endif -%}
    {% endfor %}
{% endfor %}

{%- if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
  ## New Contributors
{%- endif -%}

{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
  - @{{ contributor.username }} made their first contribution
    {%- if contributor.pr_number %} in \
      [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}) \
    {%- endif %}
{%- endfor %}\n
"""
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/docs/#introduction
# Releases before git-cliff adoption are kept verbatim; changelogs are
# generated from v0.1.5 onwards (see the release:prepare task).
footer = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

## [0.1.5](https://github.com/eproxus/tap/tree/0.1.5) (2017-09-27)

[Full Changelog](https://github.com/eproxus/tap/compare/v0.1.4...0.1.5)

**Merged pull requests:**

- Avoid compiler warnings [\\#5](https://github.com/eproxus/tap/pull/5) ([falti](https://github.com/falti))
- Use hex dependency and run with elixir 1.3.4 [\\#3](https://github.com/eproxus/tap/pull/3) ([falti](https://github.com/falti))

## [v0.1.4](https://github.com/eproxus/tap/tree/v0.1.4) (2016-06-14)

[Full Changelog](https://github.com/eproxus/tap/compare/v0.1.3...v0.1.4)

## [v0.1.3](https://github.com/eproxus/tap/tree/v0.1.3) (2016-06-14)

[Full Changelog](https://github.com/eproxus/tap/compare/v0.1.2...v0.1.3)

## [v0.1.2](https://github.com/eproxus/tap/tree/v0.1.2) (2016-06-14)

[Full Changelog](https://github.com/eproxus/tap/compare/v0.1.1...v0.1.2)

## [v0.1.1](https://github.com/eproxus/tap/tree/v0.1.1) (2016-06-14)

**Merged pull requests:**

- Rename debug\\_test.exs to tap\\_test.exs [\\#1](https://github.com/eproxus/tap/pull/1) ([splattael](https://github.com/splattael))

{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                {{ self::remote_url() }}/compare/{{ release.previous.version }}..{{ release.version }}
        {% endif -%}
    {% else -%}
        {% if release.previous.version -%}
            [unreleased]: {{ self::remote_url() }}/compare/{{ release.previous.version }}..HEAD
        {% endif -%}
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Include unconventional commits so they can be filtered by commit_parsers
# without generating warnings.
filter_unconventional = false
# Exclude commits that are not matched by any commit parser.
filter_commits = true
# Make sure breaking commits always show up in the changelog
protect_breaking_commits = true
# Order of commits in each group/release within the changelog
sort_commits = "newest"
# An array of regex based parsers to modify commit messages prior to further processing.
commit_preprocessors = [
  # Remove issue numbers.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  # Breaking changes of otherwise skipped types (e.g. `build!:`)
  { field = "breaking", pattern = "true", group = "Changed" },
  { message = "^docs?", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
  { message = ".*", skip = true },
]
# Only v-prefixed tags are releases (0.1.5 duplicates v0.1.5).
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# Order releases topologically instead of chronologically.
topo_order = false

[remote.github]
owner = "eproxus"
repo = "tap"
