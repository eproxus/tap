---
name: CI

on:
  push:
  # Manual runs preview the next release without publishing.
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            deps
            _build
          key: mix-${{runner.os}}_${{runner.arch}}-lint-${{hashFiles('mise.toml', 'mix.lock')}}
          restore-keys: |
            mix-${{runner.os}}_${{runner.arch}}-lint-

      - run: mix deps.get

      - run: mise run --output=keep-order verify

  test:
    name: Test (${{ matrix.name }})

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # Versions pinned in mise.toml
          - name: latest
          # Oldest versions supported by the elixir requirement in mix.exs
          - name: oldest
            erlang: 25.3.2.21
            elixir: 1.17.3-otp-25

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Override tool versions
        if: matrix.elixir
        env:
          ERLANG: ${{ matrix.erlang }}
          ELIXIR: ${{ matrix.elixir }}
        # mise run would otherwise install the versions pinned in mise.toml.
        run: |
          {
            echo "MISE_ERLANG_VERSION=$ERLANG"
            echo "MISE_ELIXIR_VERSION=$ELIXIR"
            echo "MISE_TASK_RUN_AUTO_INSTALL=false"
          } >> "$GITHUB_ENV"

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            deps
            _build
          key: >-
            mix-${{runner.os}}_${{runner.arch}}-test-${{matrix.name}}-${{
            hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: |
            mix-${{runner.os}}_${{runner.arch}}-test-${{matrix.name}}-

      - run: mix deps.get

      - run: mise run --output=keep-order test

  # Pushes to main publish the version in mix.exs when the head commit is its
  # untagged release commit (`chore(release): <version>`). Other runs preview
  # the next release.
  release-check:
    name: Release check

    runs-on: ubuntu-24.04

    needs: [lint, test]

    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Check version
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          VERSION=$(mise run --quiet release:version)
          if [ "$(git log -1 --format=%s)" = "chore(release): $VERSION" ] &&
            ! git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            mise run release:check
            PUBLISH=$([ "$EVENT" = push ] && echo true || echo false)
          else
            # Preview what release:prepare would produce.
            mise run release:prepare
            VERSION=$(mise run --quiet release:version)
            PUBLISH=false
          fi
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version: v$VERSION (publish: $PUBLISH)"

      - name: Summary
        env:
          PUBLISH: ${{ steps.version.outputs.publish }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            if [ "$PUBLISH" = "true" ]; then
              echo "## Release ${VERSION}"
            else
              echo "## Release Preview"
            fi
            echo ""
            echo "Version: \`${VERSION}\`"
            echo ""
            echo "## Changelog"
            echo ""
            mise run --quiet release:notes
          } >> "$GITHUB_STEP_SUMMARY"

  # Separate from release-check so that only publishing runs in the hex
  # environment, which holds the Hex API key.
  release:
    name: Release

    runs-on: ubuntu-24.04

    needs: release-check

    if: needs.release-check.outputs.publish == 'true'

    permissions:
      contents: write

    environment: hex

    env:
      VERSION: ${{ needs.release-check.outputs.version }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            deps
            _build
          key: mix-${{runner.os}}_${{runner.arch}}-release-${{hashFiles('mise.toml', 'mix.lock')}}
          restore-keys: |
            mix-${{runner.os}}_${{runner.arch}}-release-

      - run: mix deps.get

      # Hex first and the tag second, so an existing tag implies a published
      # package. Skipping published versions makes failed runs re-runnable.
      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if mix hex.info tap "${VERSION#v}" > /dev/null 2>&1; then
            echo "tap ${VERSION#v} is already on Hex"
          else
            mix hex.publish --yes
          fi

      - name: Tag and push
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mise run --quiet release:notes > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" --verify-tag --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Summary
        run: |
          {
            echo "## Released ${VERSION}"
            echo ""
            echo "- [GitHub Release](https://github.com/eproxus/tap/releases/tag/${VERSION})"
            echo "- [Hex Package](https://hex.pm/packages/tap/${VERSION#v})"
          } >> "$GITHUB_STEP_SUMMARY"
