---
name: CI

on:
  push:
  # Manual runs preview the next release without publishing.
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            deps
            _build
          key: mix-${{runner.os}}_${{runner.arch}}-lint-${{hashFiles('mise.toml', 'mix.lock')}}
          restore-keys: |
            mix-${{runner.os}}_${{runner.arch}}-lint-

      - run: mix deps.get

      - run: mise run --output=keep-order verify

  test:
    name: Test (${{ matrix.name }})

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # Versions pinned in mise.toml
          - name: latest
          # Oldest versions supported by the elixir requirement in mix.exs
          - name: oldest
            erlang: 25.3.2.21
            elixir: 1.17.3-otp-25

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Override tool versions
        if: matrix.elixir
        env:
          ERLANG: ${{ matrix.erlang }}
          ELIXIR: ${{ matrix.elixir }}
        # mise run would otherwise install the versions pinned in mise.toml.
        run: |
          {
            echo "MISE_ERLANG_VERSION=$ERLANG"
            echo "MISE_ELIXIR_VERSION=$ELIXIR"
            echo "MISE_TASK_RUN_AUTO_INSTALL=false"
          } >> "$GITHUB_ENV"

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            deps
            _build
          key: >-
            mix-${{runner.os}}_${{runner.arch}}-test-${{matrix.name}}-${{
            hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: |
            mix-${{runner.os}}_${{runner.arch}}-test-${{matrix.name}}-

      - run: mix deps.get

      - run: mise run --output=keep-order test

  # Pushes to main release the version in mix.exs unless it is already
  # tagged, so pushing a `mise run release:prepare` commit publishes it.
  release:
    name: Release

    runs-on: ubuntu-24.04

    needs: [lint, test]

    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    permissions:
      contents: write

    environment: hex

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            deps
            _build
          key: mix-${{runner.os}}_${{runner.arch}}-release-${{hashFiles('mise.toml', 'mix.lock')}}
          restore-keys: |
            mix-${{runner.os}}_${{runner.arch}}-release-

      - run: mix deps.get

      - name: Check version
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          VERSION=$(mise run --quiet release:version)
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            # Released already: preview what release:prepare would produce.
            mise run release:prepare
            VERSION=$(mise run --quiet release:version)
            PUBLISH=false
          else
            mise run release:check
            PUBLISH=$([ "$EVENT" = push ] && echo true || echo false)
          fi
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version: v$VERSION (publish: $PUBLISH)"

      - name: Read changelog
        id: changelog
        run: |
          {
            echo "changelog<<CHANGELOG_EOF"
            mise run --quiet release:notes
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Hex first and the tag second, so an existing tag implies a published
      # package. Skipping published versions makes failed runs re-runnable.
      - name: Publish to Hex
        if: steps.version.outputs.publish == 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if mix hex.info tap "${VERSION#v}" > /dev/null 2>&1; then
            echo "tap ${VERSION#v} is already on Hex"
          else
            mix hex.publish --yes
          fi

      - name: Tag and push
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          # Via env var so backticks in the changelog aren't evaluated as
          # shell command substitution.
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: >-
          gh release create "$VERSION" --verify-tag
          --title "$VERSION" --notes "$CHANGELOG"

      - name: Summary
        env:
          PUBLISH: ${{ steps.version.outputs.publish }}
          VERSION: ${{ steps.version.outputs.version }}
          # Via env var so backticks in the changelog aren't evaluated as
          # shell command substitution.
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          {
            if [ "$PUBLISH" = "true" ]; then
              echo "## Released ${VERSION}"
              echo ""
              echo "- [GitHub Release](https://github.com/eproxus/tap/releases/tag/${VERSION})"
              echo "- [Hex Package](https://hex.pm/packages/tap/${VERSION#v})"
            else
              echo "## Release Preview"
            fi
            echo ""
            echo "Version: \`${VERSION}\`"
            echo ""
            echo "## Changelog"
            echo ""
            echo "$CHANGELOG"
          } >> "$GITHUB_STEP_SUMMARY"
